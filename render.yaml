services:
  - type: web
    name: forest-fire-detector
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && ls -lh *.tflite && echo "build ok: tflite models present"
    # TFLite inference (~ms, ~50MB RAM): model loads in seconds at import,
    # 1 worker/3 threads keeps /health and /ready responsive during a
    # /predict. Timeout 300 is generous headroom for free-tier cold start.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 3 --timeout 300 --graceful-timeout 60
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2
      - key: PYTHONUNBUFFERED
        value: 1
