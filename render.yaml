services:
  - type: web
    name: forest-fire-detector
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --threads 1: background model load competes with gunicorn threads for
    # tiny free-tier CPU; 2 threads caused load_model deadlock (hang).
    # Single thread lets load complete in ~15s.
    # --timeout 180: first inference on throttled CPU can take 60-90s.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180 --graceful-timeout 30
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2
      - key: PYTHONUNBUFFERED
        value: 1
